[project]
name = "ask-flow-workbench"
version = "0.1.0"
description = "Local post-acquisition flow cytometry analysis workbench for exported FCS and CSV files."
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
